name: Render Check

on:
  push:
  pull_request:

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: npm run check

      - name: Install dependencies
        run: |
          npm ci
          npx playwright install chromium --with-deps

      - name: Start StudyFlow server
        run: |
          npm start &
          sleep 2

      - name: Check app renders
        run: |
          node - <<'NODE'
          const { chromium } = require('@playwright/test');

          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage();
            const errors = [];

            await page.addInitScript(() => {
              const student = {
                id: 1,
                name: 'Render Check',
                email: 'render-check@studyflow.test'
              };

              localStorage.setItem('studyflow-active-student', JSON.stringify(student));
            });

            page.on('pageerror', (error) => errors.push(error.message));
            page.on('console', (message) => {
              if (message.type() === 'error') {
                errors.push(message.text());
              }
            });

            const response = await page.goto('http://127.0.0.1:8001/pages/index.html', {
              waitUntil: 'networkidle'
            });

            if (!response || !response.ok()) {
              throw new Error(`Dashboard page did not load. URL: ${page.url()} Status: ${response?.status()}`);
            }

            await page.waitForSelector('.brand');
            await page.waitForSelector('#dashboardTasks .task-card');
            await page.waitForSelector('.theme-toggle', { state: 'visible' });

            const bodyText = await page.locator('body').innerText();
            if (!bodyText.includes('StudyFlow')) {
              throw new Error('StudyFlow text did not render.');
            }

            await page.locator('.theme-toggle').first().click();
            const theme = await page.evaluate(() => document.documentElement.dataset.theme);
            if (theme !== 'dark' && theme !== 'light') {
              throw new Error('Theme toggle did not update the page theme.');
            }

            if (errors.length) {
              throw new Error(errors.join('\n'));
            }

            await browser.close();
          })();
          NODE
